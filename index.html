<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Dónde viene la Micro? - Ruta 9 Sur</title>
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            color: #333;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            color: #004080;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 20px;
        }
        /* Tarjeta de Estado Gigante para Adultos Mayores */
        .status-card {
            background-color: #e6f2ff;
            border: 3px solid #0066cc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-title {
            font-size: 16px;
            font-weight: bold;
            color: #004080;
            text-transform: uppercase;
        }
        .status-main {
            font-size: 24px;
            font-weight: bold;
            color: #003366;
            margin: 10px 0;
        }
        .status-time {
            font-size: 14px;
            color: #444;
        }
        /* Mapa grande adaptado */
        #map {
            height: 400px;
            width: 100%;
            border-radius: 10px;
            border: 2px solid #ccc;
        }
        .footer {
            margin-top: 15px;
            font-size: 13px;
            color: #778;
        }
    </style>
</head>
<body>

    <h1>Micro Ruta 9 Sur</h1>
    <div class="subtitle">Trayecto Punta Arenas ⇄ San Juan (Km 36)</div>

    <!-- Panel de Estado Principal -->
    <div class="status-card">
        <div class="status-title">Estado Actual del Bus</div>
        <div id="bus-status" class="status-main">Conectando al sistema en vivo...</div>
        <div id="bus-time" class="status-time">Esperando movimiento en la ruta...</div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <div class="footer">
        Comunidad Ruta 9 Sur - Servicio en Vivo
    </div>

    <!-- Librerías de Mapas y Supabase -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Tus credenciales reales de Supabase
        const SUPABASE_URL = 'https://fayneagagfccrnhxtyly.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZheW5lYWdhZ2ZjY3JuaHh0eWx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDg5ODQsImV4cCI6MjEwNzU4NDk4NH0.hnFzJF4pbGkH8OGTXVmi7pVzOATP9IRlGVZB_EALeCY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Inicializar el mapa centrado en la Ruta 9 Sur
        var map = L.map('map').setView([-53.15, -70.91], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var busMarker = null;

        function actualizarUI(data) {
            var lat = data.latitude;
            var lon = data.longitude;
            var fecha = new Date(data.updated_at);

            if (!busMarker) {
                busMarker = L.marker([lat, lon]).addTo(map)
                    .bindPopup('<b>Micro en Ruta 9 Sur (En Vivo)</b>').openPopup();
            } else {
                busMarker.setLatLng([lat, lon]);
            }
            map.setView([lat, lon], 13);

            document.getElementById('bus-status').innerText = "🚗 Vehículo en movimiento hacia San Juan";
            document.getElementById('bus-time').innerText = "Última actualización: " + fecha.toLocaleTimeString();
        }

        // 1. Cargar la posición actual al abrir la página
        async function cargarPosicionInicial() {
            let { data, error } = await supabaseClient
                .from('ubicacion_bus')
                .select('*')
                .eq('id', 1)
                .single();

            if (data) {
                actualizarUI(data);
            }
        }
        cargarPosicionInicial();

        // 2. Escuchar cambios en tiempo real (Realtime) sin necesidad de recargar la página
        supabaseClient
            .channel('cambios-ubicacion')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ubicacion_bus', filter: 'id=eq.1' }, payload => {
                console.log('Nueva posición recibida:', payload.new);
                actualizarUI(payload.new);
            })
            .subscribe();
    </script>
</body>
</html>
