<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Dónde viene la Micro? - Ruta 9 Sur</title>
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            color: #333;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            color: #004080;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 20px;
        }
        /* Tarjeta de Estado Gigante para Adultos Mayores */
        .status-card {
            background-color: #e6f2ff;
            border: 3px solid #0066cc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-title {
            font-size: 16px;
            font-weight: bold;
            color: #004080;
            text-transform: uppercase;
        }
        .status-main {
            font-size: 24px;
            font-weight: bold;
            color: #003366;
            margin: 10px 0;
        }
        .status-time {
            font-size: 14px;
            color: #444;
        }
        /* Mapa adaptado grande */
        #map {
            height: 400px;
            width: 100%;
            border-radius: 10px;
            border: 2px solid #ccc;
        }
        .footer {
            margin-top: 15px;
            font-size: 13px;
            color: #778;
        }
    </style>
</head>
<body>

    <h1>Micro Ruta 9 Sur</h1>
    <div class="subtitle">Trayecto Punta Arenas ⇄ San Juan (Km 36)</div>

    <!-- Panel de Estado Principal -->
    <div class="status-card">
        <div class="status-title">Estado Actual del Bus</div>
        <div id="bus-status" class="status-main">Cargando posición...</div>
        <div id="bus-time" class="status-time">Sincronizando GPS...</div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <div class="footer">
        Comunidad Ruta 9 Sur - Servicio en Vivo
    </div>

    <!-- Librerías de Mapas y Supabase -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuración de Supabase (reemplaza con tus credenciales gratuitas)
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Inicializar el mapa centrado en la Ruta 9 Sur
        var map = L.map('map').setView([-53.20, -70.90], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var busMarker = null;

        async function obtenerUbicacionBus() {
            try {
                let { data, error } = await supabaseClient
                    .from('ubicacion_bus')
                    .select('*')
                    .eq('id', 1)
                    .single();

                if (error) throw error;

                if (data) {
                    var lat = data.latitude;
                    var lon = data.longitude;
                    var fecha = new Date(data.updated_at);

                    if (!busMarker) {
                        busMarker = L.marker([lat, lon]).addTo(map)
                            .bindPopup('<b>Micro en Ruta 9 Sur</b>').openPopup();
                    } else {
                        busMarker.setLatLng([lat, lon]);
                    }
                    map.setView([lat, lon], 11);

                    document.getElementById('bus-status').innerText = "🚗 Vehículo en movimiento en la ruta";
                    document.getElementById('bus-time').innerText = "Última actualización: " + fecha.toLocaleTimeString();
                }
            } catch (err) {
                console.error("Error al obtener datos:", err);
                document.getElementById('bus-status').innerText = "🟢 Sistema activo (Esperando señal)";
            }
        }

        // Consultar cada 15 segundos
        setInterval(obtenerUbicacionBus, 15000);
        obtenerUbicacionBus();
    </script>
</body>
</html>
